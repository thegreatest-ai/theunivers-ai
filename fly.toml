# fly.toml — theunivers.ai
#
# Deploy:  fly deploy          (from this folder; builds the Dockerfile, no registry needed)
# Logs:    fly logs
# Shell:   fly ssh console

app = "theunivers-ai"
primary_region = "bom"   # Mumbai. ~40ms from Dubai against ~120ms for Paris, and it also sits
                          # next to the India side of the corridor, which is where the suppliers
                          # are. Both ends of the route are served well from here.

[build]

[env]
  PORT = "8790"
  NODE_ENV = "production"
  DB_PATH = "/data/pilot.db"
  BASE_URL = "https://theunivers.ai"
  FRONTEND_URL = "https://theunivers.ai"

  # Outbound mail identity. NOT a secret — it is an address, printed on every email we send — so
  # it lives here in version control rather than in `fly secrets`, where it would be invisible.
  #
  # The mailbox is on send.theunivers.ai, which is the domain verified with Resend. It is a
  # SUBDOMAIN deliberately: the root already carries an SPF record for Microsoft 365, and a domain
  # may have only one, so sending from the root would have meant editing the record the business
  # email depends on. The display name still reads "theunivers.ai" to recipients.
  MAIL_FROM = "theunivers.ai <noreply@send.theunivers.ai>"

  # Registration is OPEN as of 2026-08-10. It was gated until three things were true, because the
  # gate was the only thing making their absence survivable:
  #   1. no reset-token leak      — the token now leaves only inside an email
  #   2. SQLite in WAL mode       — concurrent readers no longer block on a writer
  #   3. rate limiting everywhere — login had NO throttle and is not invite-gated, so the gate was
  #                                 accidentally doing that job by keeping the user table tiny
  # and a fourth that only surfaced by testing: mail must actually reach strangers, not just the
  # account owner. Resend refused every non-owner address until send.theunivers.ai was verified.
  #
  # To close it again: set this to "true" and deploy. Only the exact string "false" opens it.
  INVITE_REQUIRED = "false"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero would let the machine stop entirely and cold-start on the next visitor. One keeps the
  # site instant for the pilot; drop it to 0 later if cost matters more than first-byte time.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# SQLite lives here. Persists across deploys; without it the database is wiped on every release.
[[mounts]]
  source = "theunivers_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
