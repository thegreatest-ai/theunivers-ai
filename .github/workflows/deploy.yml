# DISABLED — this used to publish dist/ to GitHub Pages on every push to main.
#
# theunivers.ai now runs on Fly, because the product needs a Node process: the API, OAuth
# callbacks and the SQLite database cannot run on static hosting. Leaving this enabled would
# race the Fly deployment and periodically replace the working site with a static build whose
# sign-in silently fails — a login page that looks real and cannot work.
#
# Deploy with:  npm run deploy      (build + fly deploy)
#
# Kept rather than deleted so the history and the reason stay together. To bring Pages back for
# a marketing-only site, restore the `on:` block below.

name: Deploy to GitHub Pages (disabled)

on:
  workflow_dispatch:   # manual only — never on push

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
